<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabSync v3 · 연구실 통합 관리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{
  --bg:#0b0d12;--bg2:#111520;--bg3:#161b28;--bg4:#1c2235;
  --border:#1e2436;--border2:#2a3150;
  --text:#dce4f0;--text2:#7a8aaa;--text3:#3a4460;
  --prof:#4f8ef7;--prof-g:rgba(79,142,247,.12);
  --s1:#34d399;--s1-g:rgba(52,211,153,.12);
  --s2:#fbbf24;--s2-g:rgba(251,191,36,.12);
  --s3:#60a5fa;--s3-g:rgba(96,165,250,.12);
  --meet:#a78bfa;--meet-g:rgba(167,139,250,.12);
  --admin:#f87171;--admin-g:rgba(248,113,113,.12);
  --ai:#22d3ee;--ai-g:rgba(34,211,238,.12);
  --ok:#34d399;--warn:#fbbf24;--err:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
/* LOGIN */
#LS{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.lw{width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:44px 36px;}
.lw h2{font-size:20px;font-weight:700;margin-bottom:6px;}
.lw p{font-size:13px;color:var(--text2);margin-bottom:22px;}
.fl{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
.fi{width:100%;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:'Noto Sans KR',sans-serif;transition:border .2s;margin-bottom:13px;}
.fi:focus{border-color:var(--prof);}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#4f8ef7,#7c6af7);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-login:hover{opacity:.88;}
.lerr{color:var(--err);font-size:12px;margin-top:9px;text-align:center;min-height:16px;}
.lw-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;text-align:center;}
.lw-reset{cursor:pointer;text-decoration:underline;}
details summary{cursor:pointer;font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;user-select:none;margin-bottom:4px;}
.apik-row{display:flex;gap:6px;align-items:center;margin-top:7px;}
.apik-in{flex:1;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:'IBM Plex Mono',monospace;outline:none;}
.apik-btn{padding:7px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.apik-st{font-size:11px;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
/* LAYOUT */
#app{display:none;min-height:100vh;}
.sb{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50;overflow-y:auto;}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sb-logo-ic{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#4f8ef7,#a78bfa);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:#fff;}
.sb-logo-tx{font-weight:700;font-size:14px;}
.sb-logo-vr{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text3);letter-spacing:1px;}
.nsec{padding:12px 14px 4px;font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;font-size:13px;}
.ni:hover{background:var(--bg3);}
.ni.on{background:var(--bg3);border-left-color:var(--prof);}
.ni .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.ni:hover .dot,.ni.on .dot{background:var(--prof);}
.ni.cs1.on,.ni.cs1.on .dot{border-left-color:var(--s1)!important;} .ni.cs1.on .dot{background:var(--s1)!important;}
.ni.cs2.on{border-left-color:var(--s2)!important;} .ni.cs2.on .dot{background:var(--s2)!important;}
.ni.cs3.on{border-left-color:var(--s3)!important;} .ni.cs3.on .dot{background:var(--s3)!important;}
.ni.cm.on{border-left-color:var(--meet)!important;} .ni.cm.on .dot{background:var(--meet)!important;}
.ni.ca.on{border-left-color:var(--admin)!important;} .ni.ca.on .dot{background:var(--admin)!important;}
.sb-bot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;}
.upill{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--bg3);border-radius:8px;}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.uname{font-size:12px;font-weight:500;}
.urole{font-size:10px;color:var(--text2);}
.sb-out{margin-top:7px;width:100%;padding:6px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-size:12px;font-family:'Noto Sans KR',sans-serif;}
.sb-out:hover{background:var(--bg3);color:var(--text);}
.main{margin-left:220px;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;background:rgba(11,13,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.tb-title{font-size:15px;font-weight:600;}
.nb-btn{position:relative;width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.nb-btn:hover{background:var(--bg4);}
.nb-badge{position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:var(--err);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;}
.content{padding:24px;}
/* NOTIF PANEL */
.np{position:fixed;right:0;top:52px;bottom:0;width:300px;background:var(--bg2);border-left:1px solid var(--border);z-index:200;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;}
.np.open{transform:translateX(0);}
.np-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.np-list{flex:1;overflow-y:auto;padding:10px;}
.np-item{padding:10px;border-radius:7px;background:var(--bg3);margin-bottom:7px;border-left:3px solid transparent;}
.np-item.u{border-left-color:var(--prof);}
/* COMMON */
.ph{margin-bottom:20px;}
.ph h1{font-size:21px;font-weight:700;}
.ph p{font-size:13px;color:var(--text2);margin-top:3px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:18px;}
.card+.card{margin-top:14px;}
.ct{font-size:13px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:7px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:14px;}
.sv{font-size:24px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.sl{font-size:11px;color:var(--text2);margin-top:2px;}
.sd{font-size:10px;margin-top:3px;}
.sd.up{color:var(--ok);}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:500;font-family:'IBM Plex Mono',monospace;}
.bp{background:var(--prof-g);color:var(--prof);}
.bs1{background:var(--s1-g);color:var(--s1);}
.bs2{background:var(--s2-g);color:var(--s2);}
.bm{background:var(--meet-g);color:var(--meet);}
.ba{background:var(--admin-g);color:var(--admin);}
.bai{background:var(--ai-g);color:var(--ai);}
.bok{background:rgba(52,211,153,.1);color:var(--ok);}
.bwn{background:rgba(251,191,36,.1);color:var(--warn);}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;background:var(--bg4);color:var(--text2);margin-right:3px;margin-bottom:3px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Noto Sans KR',sans-serif;transition:opacity .15s;}
.btn:hover{opacity:.82;}
.btn-p{background:var(--prof);color:#fff;}
.btn-g{background:var(--ok);color:#0b0d12;}
.btn-v{background:var(--meet);color:#fff;}
.btn-r{background:var(--err);color:#fff;}
.btn-o{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.btn-o:hover{color:var(--text);}
.btn-sm{padding:4px 10px;font-size:11px;}
.fg{margin-bottom:12px;}
.fl2{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
input[type=text],input[type=password],input[type=number],input[type=date],textarea,select{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%;transition:border .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--prof);}
textarea{resize:vertical;min-height:80px;}
.pbar-w{background:var(--bg4);border-radius:3px;height:5px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;transition:width .6s;}
.tl{position:relative;padding-left:18px;}
.tl::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-dot{position:absolute;left:-18px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--border2);border:2px solid var(--bg2);}
.tl-dot.on{background:var(--prof);}
.tl-d{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-bottom:2px;}
.tl-t{font-size:13px;font-weight:500;}
.tl-s{font-size:12px;color:var(--text2);}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 11px;font-size:10px;color:var(--text2);border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;}
td{padding:9px 11px;font-size:12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.ai-box{background:var(--ai-g);border:1px solid rgba(34,211,238,.2);border-radius:9px;padding:14px;}
.ai-hd{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.ai-lbl{font-size:10px;color:var(--ai);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;}
.ai-body{font-size:13px;color:var(--text2);line-height:1.75;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--ai);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ldots::after{content:'·';animation:ld 1.2s infinite;}
@keyframes ld{0%{content:'·'}33%{content:'··'}66%{content:'···'}100%{content:'·'}}
.uz{border:2px dashed var(--border2);border-radius:9px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;}
.uz:hover,.uz.drag{border-color:var(--s1);background:var(--s1-g);}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;font-size:11px;margin-right:6px;margin-bottom:6px;}
.fc-del{cursor:pointer;color:var(--text3);}
.fc-del:hover{color:var(--err);}
.formula{background:var(--bg4);border:1px solid var(--border2);border-radius:7px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ai);line-height:1.8;margin:8px 0;}
.fb-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.poc-card{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:11px;border-left:3px solid var(--admin);}
.rec-btn{width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.rec-btn.idle{background:var(--err);}
.rec-btn.rec{background:var(--err);animation:prec 1.5s infinite;}
@keyframes prec{0%{box-shadow:0 0 0 0 rgba(248,113,113,.6)}70%{box-shadow:0 0 0 16px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}
.waveform{display:flex;align-items:center;gap:3px;height:28px;justify-content:center;}
.wbar{width:3px;background:var(--meet);border-radius:2px;animation:wv 1s ease-in-out infinite;}
@keyframes wv{0%,100%{height:4px}50%{height:24px}}
.bc{display:flex;flex-direction:column;gap:7px;}
.bc-row{display:flex;align-items:center;gap:9px;}
.bc-lbl{width:60px;font-size:10px;color:var(--text2);text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
.bc-w{flex:1;background:var(--bg4);border-radius:3px;height:7px;overflow:hidden;}
.bc-b{height:100%;border-radius:3px;}
.bc-v{width:36px;font-size:10px;color:var(--text2);font-family:'IBM Plex Mono',monospace;}
/* NEW FEATURES */
.new-upd{color:#ff4444!important;font-weight:700;}
.new-badge{display:inline-block;padding:1px 7px;border-radius:3px;background:rgba(255,68,68,.15);color:#ff4444;font-size:10px;font-family:'IBM Plex Mono',monospace;border:1px solid rgba(255,68,68,.3);margin-left:6px;}
.upd-card{background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.2);border-radius:9px;padding:14px;margin-bottom:10px;border-left:3px solid #ff4444;}
.pri-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:7px;margin-bottom:7px;border:1px solid var(--border);}
.pri-row.isnew{border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.05);}
.pri-num{width:24px;height:24px;border-radius:50%;background:var(--prof);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.pri-row.isnew .pri-num{background:#ff4444;}
.ts-hd{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px;}
.ts-btn{padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.ts-btn:hover{color:var(--text);}
.ts-btn.on{color:var(--s1);border-bottom-color:var(--s1);}
.tc{display:none;}
.tc.on{display:block;}
.dtc{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.dtc-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.dtc-hd:hover{background:var(--bg3);}
.dtc-body{padding:14px;border-top:1px solid var(--border);display:none;}
.dtc-body.open{display:block;}
.fmt-badge{display:inline-block;padding:2px 8px;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--text2);margin-right:4px;margin-bottom:3px;}
.diff-new{background:rgba(255,68,68,.12);color:#ff4444;font-weight:700;padding:0 3px;border-radius:2px;}
.diff-same{color:var(--text2);}
.alert-card{border-left:3px solid var(--warn);background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:10px;}
.alert-card.u{border-left-color:var(--err);}
/* GALLERY */
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.mc{border-radius:10px;padding:14px 12px;cursor:pointer;transition:all .2s;border:1px solid var(--border);text-align:center;position:relative;}
.mc:hover{transform:translateY(-2px);}
.mc.on{box-shadow:0 0 0 2px var(--prof);}
.mc-cnt{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.pt{border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .2s;background:var(--bg3);}
.pt:hover{border-color:var(--prof);}
.pt-img{width:100%;height:90px;background:var(--bg4);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:28px;}
.pt-ttl{font-size:11px;font-weight:600;line-height:1.4;margin-bottom:3px;}
.pt-meta{font-size:10px;color:var(--text2);}
.rbar{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ok),var(--prof));transition:width .6s;}
.rnk1{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.rnk2{background:linear-gradient(135deg,#6b7280,#9ca3af);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.rnkn{background:var(--bg4);color:var(--text2);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.rv-step{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px;}
.rv-s{flex:1;padding:8px;text-align:center;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;border-right:1px solid var(--border);}
.rv-s:last-child{border-right:none;}
.rv-s.done{background:var(--s1-g);color:var(--ok);}
.rv-s.active{background:var(--prof-g);color:var(--prof);font-weight:700;}
.rv-s.pending{color:var(--text3);}
.ab-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.ab-orig{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:13px;font-size:12px;line-height:1.75;}
.ab-ai{background:var(--ai-g);border:1px solid rgba(34,211,238,.2);border-radius:8px;padding:13px;font-size:12px;line-height:1.75;}
.gl-box{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:16px;margin-top:14px;}
.pr-rec{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(79,142,247,.08));border:1px solid rgba(34,211,238,.2);border-radius:11px;padding:18px;}
.ts-hd2{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px;}
.ts2-btn{padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.ts2-btn:hover{color:var(--text);}
.ts2-btn.on{color:var(--ai);border-bottom-color:var(--ai);}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="LS">
  <div class="lw">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:30px;">
      <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4f8ef7,#a78bfa);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:#fff;">LS</div>
      <div><div style="font-size:18px;font-weight:700;">LabSync</div><div style="font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;">RESEARCH SYSTEM v3</div></div>
    </div>
    <h2>시스템 로그인</h2>
    <p>내부 사용자만 접근 가능합니다.</p>
    <label class="fl">아이디 (ID)</label>

function saveApiKey(){
  const k=document.getElementById('aKey').value.trim();

  if(!k){st.innerHTML='<span style="color:var(--err)">입력해주세요.</span>';return;}

  st.innerHTML='<span style="color:var(--ok)">✓ 저장됨 ('+k.slice(0,12)+'...)</span>';
  document.getElementById('aKey').value='';
}
function isProfessor(){return CU&&CU.role==='professor';}

async function callClaude(sys,user,tokens){
  if(!isProfessor()) throw new Error('PROF_ONLY');
  const key=API_KEY||localStorage.getItem('ls_apikey')||'';
  if(!key) throw new Error('NO_KEY');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:tokens||1200,system:sys,messages:[{role:'user',content:user}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+r.status);}
  const d=await r.json();
  return d.content.find(c=>c.type==='text').text;
}

async function callClaudePDF(sys,user,pdfs,tokens){
  if(!isProfessor()) throw new Error('PROF_ONLY');
  const key=API_KEY||localStorage.getItem('ls_apikey')||'';
  if(!key) throw new Error('NO_KEY');
  const content=[];
  for(const b64 of pdfs) content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}});
  content.push({type:'text',text:user});
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:tokens||2500,system:sys,messages:[{role:'user',content}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+r.status);}
  const d=await r.json();
  return d.content.find(c=>c.type==='text').text;
}

function f2b64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('파일 읽기 실패'));
    r.readAsDataURL(file);
  });
}

async function aiTheory(){
  const box=document.getElementById('ai-th-box');
  box.style.display='block';
  document.getElementById('ai-th-sp').style.display='inline-block';
  document.getElementById('ai-th-txt').innerHTML='분석 중<span class="ldots"></span>';
  try{
    const t=await callClaude(
      '신소재/전기화학 전문 연구 조언가. 이론 분석, 핵심 포인트, 개선 방향을 한국어로 제시. [PART 1: 분석] [PART 2: 변경사항 요약 (● 로 시작)] [PART 3: 실험우선순위 JSON]',
      `컨셉: ${document.getElementById('t-concept').value}\n\n이론: ${document.getElementById('t-theory').value}`,
      1800
    );
    lastTheoryAnalysis=t;
    document.getElementById('ai-th-sp').style.display='none';
    document.getElementById('ai-th-txt').innerHTML=fmtAI(t).replace(/● (.+?)(<br>|$)/g,'<div style="color:#ff4444;font-weight:600;margin:3px 0;">🔴 $1</div>');
  }catch(e){
    document.getElementById('ai-th-sp').style.display='none';
    showAiErr('ai-th-txt',e);
  }
}
function saveTUpdates(){
  localStorage.setItem('ls_tupdates', JSON.stringify(DB.theoryUpdates));
}
function applyTheoryUpdate(){
  if(!lastTheoryAnalysis){alert('먼저 AI 분석을 실행해주세요.');return;}
  const bullets=lastTheoryAnalysis.split('\n').filter(l=>l.trim().startsWith('●')).map(l=>l.replace('●','').trim());
  const summary=bullets.length?bullets.join(' | '):lastTheoryAnalysis.slice(0,200);
  const nv='v'+(parseFloat(DB.theory.ver.replace('v',''))+0.1).toFixed(1);
  DB.theory.ver=nv; DB.theory.updated=new Date().toISOString().split('T')[0];
  DB.theoryUpdates.push({date:DB.theory.updated,ver:nv,summary});
  saveTUpdates();
  alert('✅ 변경사항 반영! 버전: '+nv+'\n\n이론 보기/PDF 페이지에서 전체 이력을 확인하세요.');
  go('p-theory');
}
function genExperFile(){
  if(!lastTheoryAnalysis){alert('먼저 AI 분석을 실행해주세요.');return;}
  let priorities=[];
  const m=lastTheoryAnalysis.match(/```json[\s\S]+?```/);
  if(m){try{priorities=JSON.parse(m[0].replace(/```json|```/g,'').trim());}catch(e){}}
  if(!priorities.length) priorities=[{rank:1,task:'AI 분석 기반 실험',reason:'이론 업데이트 반영',status:'대기'}];
  const data={version:DB.theory.ver,generatedAt:new Date().toISOString(),experimentPriorities:priorities.map(p=>({...p,isNew:true}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='exper_'+DB.theory.ver+'_'+DB.theory.updated+'.json';
  a.click(); URL.revokeObjectURL(url);
  alert('✅ exper 파일 다운로드!\n실험 방법 페이지에서 업로드하면 우선순위가 업데이트됩니다.');
}

function selMeas(id){selMeasType=id;go('p-papers');}
function ppDrop(e){e.preventDefault();document.getElementById('pp-uz').classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf')setPPFile(f);else alert('PDF만 가능합니다.');}
function ppSel(inp){if(inp.files[0])setPPFile(inp.files[0]);inp.value='';}
function setPPFile(f){
  ppFile=f;
  document.getElementById('pp-fi-info').innerHTML=`<div class="fchip" style="border-color:rgba(34,211,238,.3);">📄 ${f.name} (${(f.size/1024/1024).toFixed(1)}MB)<span class="fc-del" onclick="clearPPFile()">×</span></div>`;
  document.getElementById('pp-meta').style.display='block';
  document.getElementById('pp-title').value=f.name.replace('.pdf','').replace(/_/g,' ');
}
function clearPPFile(){ppFile=null;document.getElementById('pp-fi-info').innerHTML='';document.getElementById('pp-meta').style.display='none';}
function openPaper(id){curPaperId=id;go('p-paper-detail');}

function regPaper(){
  const title=document.getElementById('pp-title').value.trim();
  if(!title){alert('논문 제목을 입력해주세요.');return;}
  if(!ppFile){alert('PDF를 먼저 업로드해주세요.');return;}
  const mt=Array.from(document.querySelectorAll('.pp-mt:checked')).map(el=>el.value);
  const np={
    id:'p_'+Date.now(),title,
    journal:document.getElementById('pp-journal').value||'',
    year:parseInt(document.getElementById('pp-year').value)||new Date().getFullYear(),
    doi:document.getElementById('pp-doi').value||'',
    tags:document.getElementById('pp-tags').value.split(',').map(x=>x.trim()).filter(Boolean),
    measureTypes:mt,pdfName:ppFile.name,pdfB64:null,
    abstract_orig:'',abstract_summary:'',abstract_approved:false,
    findings:'',synthesis:'',methods:'',
    relevanceScore:0,uploadedAt:new Date().toLocaleDateString('ko-KR'),status:'미정리'
  };
  const reader=new FileReader();
  reader.onload=function(e){
    np.pdfB64=e.target.result.split(',')[1];
    paperLib.push(np);savePLib();
    curPaperId=np.id;ppFile=null;
    alert('✅ 등록 완료! 논문 정리본으로 이동합니다.');
    go('p-paper-detail');
  };
  reader.readAsDataURL(ppFile);
}

// ── PROF: PAPER DETAIL
const RV_STEPS=[{id:'abstract',label:'Abstract',icon:'📝'},{id:'findings',label:'주요 발견',icon:'🔍'},{id:'synthesis',label:'합성 방법',icon:'⚗️'},{id:'methods',label:'측정 방법',icon:'📊'}];
function pgPaperDetail(mc){
  const paper=paperLib.find(p=>p.id===curPaperId);
  if(!paper){mc.innerHTML=`<div class="ph"><h1 style="font-size:21px;font-weight:700;">📄 논문 정리본</h1></div><div class="card"><p style="color:var(--text2);">논문을 선택해주세요. <button class="btn btn-o btn-sm" onclick="go('p-papers')">← 갤러리</button></p></div>`;return;}
  const mt=MEAS.find(m=>m.id===(paper.measureTypes||[])[0])||{color:'var(--prof)',icon:'📄'};
  let h=`<div style="display:flex;gap:10px;margin-bottom:16px;"><button class="btn btn-o btn-sm" onclick="go('p-papers')">← 갤러리</button><div style="flex:1;font-size:13px;color:var(--text2);">논문 정리본</div><button class="btn btn-o btn-sm" onclick="delPaper('${paper.id}')">🗑️ 삭제</button></div>`;
  // 헤더
  h+=`<div style="background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:11px;padding:18px;margin-bottom:14px;">
    <div style="display:flex;gap:12px;"><div style="width:42px;height:42px;border-radius:9px;background:${mt.color}22;border:1px solid ${mt.color}44;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${mt.icon}</div>
    <div style="flex:1;">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px;">${paper.title}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:6px;">${paper.journal} (${paper.year})${paper.doi?` · <a href="https://doi.org/${paper.doi}" target="_blank" style="color:var(--ai);">DOI</a>`:''}</div>
      <div style="margin-bottom:8px;">${(paper.measureTypes||[]).map(id=>{const m2=MEAS.find(x=>x.id===id)||{label:id,color:'var(--ai)'};return `<span style="font-size:10px;padding:2px 8px;border-radius:12px;background:${m2.color}20;color:${m2.color};border:1px solid ${m2.color}44;margin-right:4px;">${m2.label}</span>`;}).join('')}${paper.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:11px;color:var(--text3);">연관성</span>
        <div style="width:100px;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden;"><div class="rbar" style="width:${Math.min(paper.relevanceScore||0,100)}%"></div></div>
        <span style="font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--prof);">${paper.relevanceScore||0}점</span>
        <button class="btn btn-o btn-sm" onclick="evalRel('${paper.id}')">🤖 연관성 평가</button>
      </div>
    </div></div>
  </div>`;
  // 스텝 진행
  h+=`<div class="card" style="margin-bottom:14px;"><div class="rv-step">`;
  RV_STEPS.forEach(s=>{
    const done=s.id==='abstract'?paper.abstract_approved:!!paper[s.id];
    h+=`<div class="rv-s ${done?'done':'pending'}">${s.icon} ${s.label}${done?' ✓':''}</div>`;
  });
  h+=`</div></div>`;
  // 각 섹션
  RV_STEPS.forEach(s=>{ h+=buildPaperSection(paper,s.id); });
  // PDF
  h+=`<div class="card" style="margin-top:14px;"><div class="ct">📎 원본 PDF</div>${paper.pdfName?`<div class="fchip" style="border-color:rgba(34,211,238,.3);">📄 ${paper.pdfName}</div>`:''}</div>`;
  // 가이드라인
  if((paper.relevanceScore||0)>=70) h+=buildRelGuide(paper);
  mc.innerHTML=h;
}

function buildPaperSection(paper,type){
  const labels={abstract:'📝 Abstract',findings:'🔍 주요 발견',synthesis:'⚗️ 합성 방법',methods:'📊 측정 방법'};
  const prompts={
    abstract:`논문 "${paper.title}" (${paper.journal}, ${paper.year})의 Abstract를 한국어로 정리해주세요.\n형식:\n【핵심 연구 목적】\n【주요 방법론】\n【핵심 결과 (수치 포함)】\n【의의 및 결론】\n\n⚠️ 원본과 다를 수 있으니 반드시 대조하여 검토해주세요.`,
    findings:`논문 "${paper.title}"의 주요 발견을 정리해주세요.\n형식:\n【주요 발견 1】\n【주요 발견 2】\n【NCM811 연구 시사점】\n\n⚠️ 내용이 틀릴 수 있으니 검토 후 사용해주세요.`,
    synthesis:`논문 "${paper.title}"의 합성 방법을 정리해주세요.\n형식:\n【시약 및 전구체】\n【합성 조건】\n【후처리】\n【핵심 변수】\n\n⚠️ 수치가 원본과 다를 수 있으니 반드시 검토해주세요.`,
    methods:`논문 "${paper.title}"의 측정 방법을 정리해주세요.\n측정 유형: ${(paper.measureTypes||[]).join(', ')}\n형식:\n【측정 조건】\n【데이터 처리】\n\n⚠️ 장비 조건이 원본과 다를 수 있으니 검토해주세요.`
  };
  const isAbs=type==='abstract';
  const isDone=isAbs?paper.abstract_approved:!!paper[type];
  const content=isAbs?(paper.abstract_summary||''):(paper[type]||'');
  const enc=encodeURIComponent(prompts[type]);
  let h=`<div class="card" id="sec-${type}" style="margin-top:14px;"><div class="ct" style="${isDone?'color:var(--ok);':''}">${labels[type]}${isDone?' ✅':''}</div>`;
  if(isAbs&&paper.abstract_orig){
    h+=`<div class="ab-cmp">
      <div class="ab-orig"><div style="font-size:10px;color:var(--text3);font-family:IBM Plex Mono,monospace;margin-bottom:6px;">ORIGINAL</div>${paper.abstract_orig}</div>
      <div class="ab-ai"><div style="font-size:10px;color:var(--ai);font-family:IBM Plex Mono,monospace;margin-bottom:6px;">AI 정리본</div>${content||'<span style="color:var(--text3)">아직 정리되지 않았습니다.</span>'}</div>
    </div>`;
    if(!paper.abstract_approved){
      h+=`<div style="display:flex;gap:7px;margin-bottom:10px;">
        <button class="btn btn-g btn-sm" onclick="approveSec('${paper.id}','abstract')">✅ 동의 (채택)</button>
        <button class="btn btn-o btn-sm" onclick="inputSec('${paper.id}','abstract')">✏️ 수정</button>
      </div>`;
    }
  }else if(content){
    h+=`<div style="white-space:pre-wrap;font-size:13px;color:var(--text2);line-height:1.85;background:var(--bg3);border-radius:7px;padding:13px;margin-bottom:10px;">${content}</div>
    <button class="btn btn-o btn-sm" onclick="inputSec('${paper.id}','${type}')">✏️ 수정</button>`;
  }else{
    h+=`<div style="font-size:12px;color:var(--text3);padding:10px;background:var(--bg3);border-radius:7px;margin-bottom:10px;">아직 정리되지 않았습니다.</div>`;
  }
  if(!isDone){
    h+=`<div style="margin-top:10px;padding:10px;background:var(--ai-g);border:1px solid rgba(34,211,238,.2);border-radius:7px;">
      <div style="font-size:11px;color:var(--ai);margin-bottom:7px;">💬 Claude.ai로 정리하기</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-p btn-sm" data-enc="${enc}" data-pid="${paper.id}" data-type="${type}" onclick="openSecClaude(this.dataset.pid,this.dataset.type,this.dataset.enc)">🚀 Claude.ai 열기</button>
        <button class="btn btn-o btn-sm" onclick="inputSec('${paper.id}','${type}')">✍️ 직접 입력</button>
      </div>
    </div>`;
  }
  h+=`<div id="input-area-${type}" style="display:none;margin-top:10px;">
    <label class="fl2">내용 입력 (Claude.ai 응답 붙여넣기)</label>
    <textarea id="input-txt-${type}" style="min-height:140px;" placeholder="Claude.ai 응답 붙여넣기..."></textarea>
    ${isAbs?`<label class="fl2" style="margin-top:8px;">원본 Abstract (논문에서 복사)</label><textarea id="input-orig-${type}" style="min-height:70px;" placeholder="원문 Abstract..."></textarea>`:''}
    <div style="display:flex;gap:7px;margin-top:8px;">
      <button class="btn btn-p btn-sm" data-pid="${paper.id}" data-type="${type}" onclick="saveSec(this.dataset.pid,this.dataset.type)">💾 저장</button>
      <button class="btn btn-o btn-sm" onclick="document.getElementById('input-area-${type}').style.display='none'">취소</button>
    </div>
  </div></div>`;
  return h;
}

function openSecClaude(pid,type,enc){
  const p=decodeURIComponent(enc);
  navigator.clipboard.writeText(p).catch(()=>{});
  window.open('https://claude.ai','_blank');
  inputSec(pid,type);
  alert('📋 프롬프트 복사!\n\n1. Claude.ai에서 붙여넣기\n2. 이 창에서 결과 붙여넣기\n\n⚠️ 내용이 틀릴 수 있으니 원본과 대조해주세요.');
}
function inputSec(pid,type){
  const el=document.getElementById('input-area-'+type);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}
function saveSec(pid,type){
  const paper=paperLib.find(p=>p.id===pid);
  if(!paper)return;
  const txt=document.getElementById('input-txt-'+type)?.value.trim();
  if(!txt){alert('내용을 입력해주세요.');return;}
  if(type==='abstract'){
    paper.abstract_summary=txt;
    const orig=document.getElementById('input-orig-abstract')?.value.trim();
    if(orig) paper.abstract_orig=orig;
    paper.abstract_approved=false;
  }else{
    paper[type]=txt;
  }
  paper.status=(paper.abstract_approved&&paper.findings&&paper.synthesis&&paper.methods)?'완료':'진행중';
  savePLib();
  alert('✅ 저장!\n\n⚠️ 원본 논문과 반드시 대조해주세요.');
  go('p-paper-detail');
}
function approveSec(pid,type){
  const paper=paperLib.find(p=>p.id===pid);
  if(!paper)return;
  if(type==='abstract') paper.abstract_approved=true;
  paper.status=(paper.abstract_approved&&paper.findings&&paper.synthesis&&paper.methods)?'완료':'진행중';
  savePLib(); alert('✅ 채택!'); go('p-paper-detail');
}
function delPaper(){
  if(!curPaperId||!confirm('삭제하시겠습니까?'))return;
  paperLib=paperLib.filter(p=>p.id!==curPaperId);
  savePLib(); curPaperId=null; go('p-papers');
}
function evalRel(pid){
  const paper=paperLib.find(p=>p.id===pid);
  if(!paper)return;
  const prompt=`다음 논문이 NCM811 배터리 양극재 연구(결정질화도 최적화 목표)와 얼마나 연관성이 있는지 0-100점으로 평가해주세요.\n\n논문: ${paper.title}\n저널: ${paper.journal} (${paper.year})\n측정 유형: ${(paper.measureTypes||[]).join(', ')}\n\nJSON 형식으로만: {"score":85,"reason":"이유","priority":"높음/중간/낮음"}`;
  navigator.clipboard.writeText(prompt).catch(()=>{});
  window.open('https://claude.ai','_blank');
  const s=prompt('Claude.ai 응답에서 score 값 입력 (0-100):');
  if(s!==null){const n=parseInt(s);if(!isNaN(n)&&n>=0&&n<=100){paper.relevanceScore=n;savePLib();alert('✅ '+n+'점 업데이트!');go('p-paper-detail');}}
}
function buildRelGuide(paper){
  return `<div class="gl-box"><div style="font-size:12px;font-weight:700;color:#f87171;margin-bottom:8px;">🔥 높은 연관성 — PDF 분석 가이드라인</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;">연관성 점수 <strong style="color:#f87171;">${paper.relevanceScore}점</strong> — 다음 절차를 따라 심층 분석을 진행하세요:</div>
    ${[
      'PDF 논문 분석(🔍) 메뉴에서 이 논문을 업로드',
      '이론 업데이트 또는 결과 비교 분석 유형 선택',
      '분석 결과에서 현재 실험 조건과 다른 점 파악',

    <button class="btn btn-sm" style="background:#f87171;color:#fff;margin-top:10px;" onclick="go('p-pdf')">→ PDF 분석으로 이동</button>
  </div>`;
}

  try{

function applyMeth(){
  const txt=document.getElementById('meth-input-txt')?.value.trim();

  const el=document.getElementById('meth-converted');
  el.innerHTML=`<div style="white-space:pre-wrap;font-size:13px;line-height:1.85;background:var(--bg3);border-radius:7px;padding:13px;">${txt}</div>`;

  document.getElementById('meth-input-area').style.display='none';

function showDiff(){
  const el=document.getElementById('meth-converted');
  const newTxt=el?.dataset?.text||document.getElementById('meth-input-txt')?.value||'';
  if(!newTxt){alert('먼저 텍스트 변환을 완료해주세요.');return;}
  const base='1. Ni(OH)₂:Co(OH)₂:Mn(OH)₂ = 8:1:1\n2. LiOH·H₂O Li/(Ni+Co+Mn) = 1.05\n3. 공 믹서 250rpm, 12h\n4. 80°C 오버나이트 건조\n5. 소성: 850°C, 12h, O₂\n6. 승온: 5°C/min\n7. 자연 냉각';
  const bLines=base.split('\n');
  const nLines=newTxt.split('\n').slice(0,20);
  let diffH='';
  nLines.forEach((line,i)=>{
    const bl=bLines[i]||'';
    if(!bl){diffH+=`<div class="diff-new">+ ${line}</div>`;}
    else if(line.trim()===bl.trim()){diffH+=`<div class="diff-same">${line}</div>`;}
    else{
      const bW=bl.split(/\s+/);
      diffH+='<div>';
      line.split(/\s+/).forEach(w=>{diffH+=bW.includes(w)?`<span class="diff-same">${w}</span> `:`<span class="diff-new">${w}</span> `;});
      diffH+='</div>';
    }
  });
  const diffEl=document.getElementById('meth-diff');
  diffEl.style.display='block';
  diffEl.innerHTML=`<div style="font-size:13px;font-weight:600;margin-bottom:10px;">🔴 기존 프로토콜 대비 변경사항</div>

      <div><div style="font-size:10px;color:var(--text3);font-family:IBM Plex Mono,monospace;margin-bottom:5px;">기존 (BASE)</div>
        <div style="white-space:pre-wrap;font-size:12px;background:var(--bg3);border-radius:7px;padding:11px;">${base}</div></div>
      <div><div style="font-size:10px;color:var(--text3);font-family:IBM Plex Mono,monospace;margin-bottom:5px;">이번 실험 <span style="color:#ff4444;">🔴 변경사항</span></div>
        <div style="font-size:12px;background:var(--bg3);border-radius:7px;padding:11px;">${diffH}</div></div>
    </div>`;
}

// 데이터 TAB2
function togDtC(id){const el=document.getElementById('dtb-'+id);if(el)el.classList.toggle('open');}

function addDtFiles(id,files){
  if(!dataFiles[id]) dataFiles[id]=[];

function renderDtList(id){
  const dt=DATA_TYPES.find(t=>t.id===id);

function rmDtFile(id,i){if(dataFiles[id]){dataFiles[id].splice(i,1);renderDtList(id);}}

    id:'sd'+Date.now(),student:CU.id,studentName:CU.name,title,date,cond,types,

    interpretations:{...dataInterp},status:'업로드완료',profAnalysis:null,
    uploadedAt:new Date().toLocaleString('ko-KR')
  };
  studentData.push(entry);saveStudentData();

function adminReset(id){
  const pw=document.getElementById('npw-'+id)?.value.trim();
  if(!pw||pw.length<4){alert('4자 이상 입력');return;}
  const accs=getAccts();const a=accs.find(x=>x.id===id);
  if(a){a.pw=pw;saveAccts(accs);alert('✅ '+a.name+' 비밀번호 변경!');}
  document.getElementById('npw-'+id).value='';
}

function changePW(){
  const cur=document.getElementById('pw-cur').value,nw=document.getElementById('pw-new').value,cf=document.getElementById('pw-cf').value;
  const msg=document.getElementById('pw-msg');
  const accs=getAccts();const acc=accs.find(a=>a.id===CU.id);
  if(!acc||acc.pw!==cur){msg.style.color='var(--err)';msg.textContent='❌ 현재 비밀번호 틀림';return;}
  if(nw.length<4){msg.style.color='var(--err)';msg.textContent='❌ 4자 이상';return;}
  if(nw!==cf){msg.style.color='var(--err)';msg.textContent='❌ 불일치';return;}
  acc.pw=nw;saveAccts(accs);
  msg.style.color='var(--ok)';msg.textContent='✅ 변경 완료!';
  ['pw-cur','pw-new','pw-cf'].forEach(id=>document.getElementById(id).value='');
}
